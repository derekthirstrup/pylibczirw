---
name: Build Python 3.14 Wheels

on:
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:Version input is required to select which release to build
    inputs:
      version:
        description: "pylibCZIrw base version (without the +py314.fork local suffix)"
        required: true
        default: "6.1.0"

permissions: {}

jobs:
  build-linux:
    name: Build Linux x86_64 ${{ matrix.tag }} wheel
    # Pinned, not ubuntu-latest: auditwheel derives the manylinux tag from the
    # runner's glibc (2.39 on 24.04), and downstream installers hardcode
    # manylinux_2_39_x86_64 in the wheel filename they download.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYLIBCZIRW_BASE_VERSION: ${{ inputs.version }}
      PYLIBCZIRW_FORK_VERSION: "${{ inputs.version }}+py314.fork"
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install "$PYTHON_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev zlib1g-dev libeigen3-dev

      - name: Clone and build pylibCZIrw
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pylibczirw-build"
          echo "Building pylibCZIrw $PYLIBCZIRW_FORK_VERSION for $PYTHON_VERSION"
          git clone --recursive --branch "v$PYLIBCZIRW_BASE_VERSION" --depth 1 \
              https://github.com/ZEISS/pylibczirw.git "$workdir"
          cd "$workdir"
          # Stamp the fork-local version (PEP 440 local label) into setup.py.
          sed -i.bak "s/VERSION = \"0.0.0\"/VERSION = \"$PYLIBCZIRW_FORK_VERSION\"/" setup.py
          # CMake's project(VERSION x) only accepts numeric M.m.p[.t] — the
          # PEP 440 local label "+py314.fork" is invalid there. Pass the
          # base version (everything before the "+") to CMake while leaving
          # setuptools' VERSION (used for wheel metadata + filename) intact.
          sed -i.bak 's|"-DPYLIBCZIRW_VERSION=" + VERSION|"-DPYLIBCZIRW_VERSION=" + VERSION.split("+", 1)[0]|' setup.py
          rm -f setup.py.bak
          uv venv --python="$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python \
              build setuptools wheel packaging xmltodict validators numpy cmake
          .venv/bin/python -m build --wheel --outdir dist
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/*.whl "$GITHUB_WORKSPACE/dist/"

      - name: Repair wheel for manylinux
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pylibczirw-build/.venv"
          uv pip install --python "$venv/bin/python" auditwheel
          "$venv/bin/python" -m auditwheel repair \
              "$GITHUB_WORKSPACE"/dist/*.whl \
              -w "$GITHUB_WORKSPACE/repaired"
          rm "$GITHUB_WORKSPACE"/dist/*.whl
          mv "$GITHUB_WORKSPACE/repaired"/*.whl "$GITHUB_WORKSPACE/dist/"

      - name: Smoke test wheel (isolated)
        run: |
          set -euo pipefail
          uv venv --python="$PYTHON_VERSION" "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" \
              "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" -I -c \
              "import _pylibCZIrw; from pylibCZIrw import czi; print(_pylibCZIrw.__name__, czi.__name__)"

      # Record, rather than assume, how the module behaves under free-threading:
      # upstream's PYBIND11_MODULE does not declare py::mod_gil_not_used(), so
      # importing it on cp314t is expected to turn the GIL back on (with a
      # RuntimeWarning). The step also fails if the interpreter is not a
      # free-threaded build, which would mean the cp314t wheel is mislabelled.
      - name: Free-threading smoke test (cp314t)
        if: matrix.tag == 'cp314t'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" -I -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1, 'not a free-threaded interpreter'; print('GIL enabled before import:', sys._is_gil_enabled()); import _pylibCZIrw; from pylibCZIrw import czi; print('GIL enabled after import:', sys._is_gil_enabled())"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pylibCZIrw-linux-${{ matrix.tag }}-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 ${{ matrix.tag }} wheel
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYLIBCZIRW_BASE_VERSION: ${{ inputs.version }}
      PYLIBCZIRW_FORK_VERSION: "${{ inputs.version }}+py314.fork"
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install "$env:PYTHON_VERSION"

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Clone and build pylibCZIrw
        shell: pwsh
        run: |
          $version = $env:PYLIBCZIRW_FORK_VERSION
          $baseVersion = $env:PYLIBCZIRW_BASE_VERSION
          $workdir = "$env:RUNNER_TEMP\pylibczirw-build"

          Write-Host "Building pylibCZIrw $version for $env:PYTHON_VERSION"

          git clone --recursive --branch "v$baseVersion" --depth 1 `
              https://github.com/ZEISS/pylibczirw.git "$workdir"

          Set-Location "$workdir"

          (Get-Content setup.py) -replace 'VERSION = "0.0.0"', "VERSION = `"$version`"" | Set-Content setup.py
          # CMake project(VERSION) only accepts numeric M.m.p[.t]; strip the
          # PEP 440 local label when constructing the CMake -D arg while
          # keeping setuptools' VERSION (and wheel filename) intact.
          (Get-Content setup.py) -replace [regex]::Escape('"-DPYLIBCZIRW_VERSION=" + VERSION'), '"-DPYLIBCZIRW_VERSION=" + VERSION.split("+", 1)[0]' | Set-Content setup.py

          uv venv --python="$env:PYTHON_VERSION" .venv
          uv pip install --python .venv\Scripts\python.exe `
              build setuptools wheel packaging xmltodict validators numpy cmake

          .venv\Scripts\python.exe -m build --wheel

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist"
          Copy-Item dist\*.whl "$env:GITHUB_WORKSPACE\dist\"

      - name: Smoke test wheel (isolated)
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist\*.whl")[0].FullName
          uv venv --python="$env:PYTHON_VERSION" "$env:RUNNER_TEMP\smoke-venv"
          uv pip install --python "$env:RUNNER_TEMP\smoke-venv\Scripts\python.exe" "$wheel"
          Push-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\smoke-venv\Scripts\python.exe" -I -c `
              "import _pylibCZIrw; from pylibCZIrw import czi; print(_pylibCZIrw.__name__, czi.__name__)"
          Pop-Location

      # See the Linux job: records the GIL state after import on cp314t.
      - name: Free-threading smoke test (cp314t)
        if: matrix.tag == 'cp314t'
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\smoke-venv\Scripts\python.exe" -I -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1, 'not a free-threaded interpreter'; print('GIL enabled before import:', sys._is_gil_enabled()); import _pylibCZIrw; from pylibCZIrw import czi; print('GIL enabled after import:', sys._is_gil_enabled())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pylibCZIrw-windows-${{ matrix.tag }}-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 ${{ matrix.tag }} wheel
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "cpython-3.14"
            tag: "cp314"
          - python: "cpython-3.14t"
            tag: "cp314t"
    env:
      PYLIBCZIRW_BASE_VERSION: ${{ inputs.version }}
      PYLIBCZIRW_FORK_VERSION: "${{ inputs.version }}+py314.fork"
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.14
        run: uv python install "$PYTHON_VERSION"

      # pylibCZIrw >= 6.1.0 forces LIBCZI_BUILD_PREFER_EXTERNALPACKAGE_EIGEN3=ON
      # whenever Homebrew is present, and libCZI's CMake fails if Eigen3 is
      # then missing (upstream's own build.yml added the same brew install).
      - name: Install build dependencies
        run: brew install cmake eigen

      - name: Clone and build pylibCZIrw
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pylibczirw-build"
          echo "Building pylibCZIrw $PYLIBCZIRW_FORK_VERSION for $PYTHON_VERSION"
          git clone --recursive --branch "v$PYLIBCZIRW_BASE_VERSION" --depth 1 \
              https://github.com/ZEISS/pylibczirw.git "$workdir"
          cd "$workdir"
          sed -i.bak "s/VERSION = \"0.0.0\"/VERSION = \"$PYLIBCZIRW_FORK_VERSION\"/" setup.py
          # See linux job: CMake project(VERSION) needs the numeric base only.
          sed -i.bak 's|"-DPYLIBCZIRW_VERSION=" + VERSION|"-DPYLIBCZIRW_VERSION=" + VERSION.split("+", 1)[0]|' setup.py
          rm -f setup.py.bak
          uv venv --python="$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python \
              build setuptools wheel packaging xmltodict validators numpy cmake
          .venv/bin/python -m build --wheel --outdir dist
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/*.whl "$GITHUB_WORKSPACE/dist/"

      - name: Smoke test wheel (isolated)
        run: |
          set -euo pipefail
          uv venv --python="$PYTHON_VERSION" "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" \
              "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" -I -c \
              "import _pylibCZIrw; from pylibCZIrw import czi; print(_pylibCZIrw.__name__, czi.__name__)"

      # Record, rather than assume, how the module behaves under free-threading:
      # upstream's PYBIND11_MODULE does not declare py::mod_gil_not_used(), so
      # importing it on cp314t is expected to turn the GIL back on (with a
      # RuntimeWarning). The step also fails if the interpreter is not a
      # free-threaded build, which would mean the cp314t wheel is mislabelled.
      - name: Free-threading smoke test (cp314t)
        if: matrix.tag == 'cp314t'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" -I -c "import sys, sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1, 'not a free-threaded interpreter'; print('GIL enabled before import:', sys._is_gil_enabled()); import _pylibCZIrw; from pylibCZIrw import czi; print('GIL enabled after import:', sys._is_gil_enabled())"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pylibCZIrw-macos-${{ matrix.tag }}-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish wheels to GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYLIBCZIRW_BASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: pylibCZIrw-*-wheel
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -la wheels/

      # Downstream installers pin each asset's SHA256, so a published release
      # is immutable: re-running this workflow for a version that already has
      # a release must fail rather than replace its wheels. Build a new
      # version instead.
      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.PYLIBCZIRW_BASE_VERSION }}+py314
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; its assets are pinned downstream and must not be replaced."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists without a release; delete it deliberately or build a new version."
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.PYLIBCZIRW_BASE_VERSION }}+py314
          # Tag the commit whose workflow built these wheels, not the default branch.
          target_commitish: ${{ github.sha }}
          name: pylibCZIrw ${{ env.PYLIBCZIRW_BASE_VERSION }}+py314.fork
          body: |
            Unofficial Python 3.14 wheels (cp314 and cp314t free-threaded)
            for pylibCZIrw ${{ env.PYLIBCZIRW_BASE_VERSION }}. Not published to PyPI.

            Built from the unmodified upstream tag
            https://github.com/ZEISS/pylibczirw/tree/v${{ env.PYLIBCZIRW_BASE_VERSION }}
            by the `Build Python 3.14 Wheels` workflow
            (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            The only change is the version string, which carries the PEP 440
            local label `+py314.fork`.

            The cp314t wheels are genuine free-threaded builds. The extension
            does not declare that it can run without the GIL, so importing it
            on a free-threaded interpreter turns the GIL back on.

            Install with pip:

                pip install --find-links \
                  https://github.com/derekthirstrup/pylibczirw/releases/expanded_assets/v${{ env.PYLIBCZIRW_BASE_VERSION }}+py314 \
                  pylibczirw==${{ env.PYLIBCZIRW_BASE_VERSION }}+py314.fork

            Assets of a published release are never replaced; a rebuild ships
            as a new version.
          files: wheels/*.whl
          fail_on_unmatched_files: true
          overwrite_files: false
